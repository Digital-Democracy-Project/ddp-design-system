name: Publish to npm

# Publishes via npm trusted publishing (OIDC) -- no NPM_TOKEN, no 2FA codes.
# Trigger: push a version tag that matches package.json, e.g. `git tag v0.4.1 && git push origin v0.4.1`.
# One-time setup this workflow does not do: npmjs.com -> package -> Settings -> Trusted Publisher ->
#   GitHub Actions, org "Digital-Democracy-Project", repo "ddp-design-system", workflow "publish.yml",
#   environment "ddp-design-publisher" (GitHub creates the environment on first run).

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment name set in the npm Trusted Publisher config.
    environment: ddp-design-publisher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5.1, required for trusted publishing
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      # prepack runs the build; provenance is attached automatically with trusted publishing.
      - run: npm publish
